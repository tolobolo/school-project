<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Pumpfoil plasser</title>
  <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
    <div class="layout-top">
       <div class="image-contianer">
             <img src="bilder/Icon.png" alt="foil icon">
                 </div>
       <div>
           <h1>Pumpfoil/Wingfoil Plasser</h1>

       </div>
        <div>
            <select id="filter-type">
              <option value="alle">Alle typer</option>
              <option value="pumpfoil">Pumpfoil</option>
              <option value="wingfoil">Wingfoil</option>
            </select>
            <select id="filter-rating">
              <option value="0">Alle ratinger</option>
              <option value="2">★★ og opp</option>
              <option value="3">★★★ og opp</option>
              <option value="4">★★★★ og opp</option>
              <option value="5">★★★★★</option>
            </select>
        </div>
    </div>

    <div class="layout-places"></div>

    <script src="script.js"></script>
</body>
</html>
